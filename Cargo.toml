[workspace]
members = ["crates/dekyx-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
zkfmi-crypto = { path = "../zkfmi-crypto" }
deccp-core = { git = "https://github.com/shukob/deccp.git", rev = "b2dc95bb01d3fc50c96249962f5ea8344a857d6d" }
dekyx-core = { path = "crates/dekyx-core" }
qomm-avalanche-vm = { git = "https://github.com/shukob/defmi.git", rev = "d8a54fa89676d7ca993c8683658e5dcdb37788c2" }
zkpi-defmi-sdk = { git = "https://github.com/shukob/defmi.git", rev = "d8a54fa89676d7ca993c8683658e5dcdb37788c2" }
qomm-defmi = { git = "https://github.com/shukob/defmi.git", rev = "d8a54fa89676d7ca993c8683658e5dcdb37788c2" }
qomm-zkpi = { git = "https://github.com/shukob/zkpi.git", rev = "b50704ab27dac55f3ccef70a5c97ab7eb3893f39" }
qomm-zk = { git = "https://github.com/shukob/zkpi.git", rev = "b50704ab27dac55f3ccef70a5c97ab7eb3893f39" }
qomm-proofs = { git = "https://github.com/shukob/zkpi.git", rev = "b50704ab27dac55f3ccef70a5c97ab7eb3893f39" }
qomm-measure = { git = "https://github.com/shukob/qomm.git", rev = "26026b5807ce6bd093e363ddc8e71b53b084cb19" }
qomm-audit = { git = "https://github.com/shukob/qomm.git", rev = "26026b5807ce6bd093e363ddc8e71b53b084cb19" }
qomm-transport = { git = "https://github.com/shukob/qomm.git", rev = "26026b5807ce6bd093e363ddc8e71b53b084cb19" }
qomm-mpc = { git = "https://github.com/shukob/qomm.git", rev = "26026b5807ce6bd093e363ddc8e71b53b084cb19" }
qomm-sim = { git = "https://github.com/shukob/qomm.git", rev = "26026b5807ce6bd093e363ddc8e71b53b084cb19" }
qomm-law = { git = "https://github.com/shukob/qomm.git", rev = "26026b5807ce6bd093e363ddc8e71b53b084cb19" }
qomm-dsl = { git = "https://github.com/shukob/qomm.git", rev = "26026b5807ce6bd093e363ddc8e71b53b084cb19" }
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core", "serde"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
serde_json = "1.0.145"


# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/shukob/qomm.git"]
qomm-dsl = { path = "../qomm/rust/qomm-dsl" }
qomm-law = { path = "../qomm/rust/qomm-law" }
qomm-sim = { path = "../qomm/rust/qomm-sim" }
qomm-mpc = { path = "../qomm/rust/qomm-mpc" }
qomm-transport = { path = "../qomm/rust/qomm-transport" }
qomm-audit = { path = "../qomm/rust/qomm-audit" }
qomm-measure = { path = "../qomm/rust/qomm-measure" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/shukob/zkpi.git"]
qomm-proofs = { path = "../zkpi/rust/qomm-proofs" }
qomm-zk = { path = "../zkpi/rust/qomm-zk" }
qomm-zkpi = { path = "../zkpi/rust/qomm-zkpi" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/shukob/defmi.git"]
qomm-defmi = { path = "../defmi/rust/qomm-defmi" }
zkpi-defmi-sdk = { path = "../defmi/rust/zkpi-defmi-sdk" }
qomm-avalanche-vm = { path = "../defmi/rust/qomm-avalanche-vm" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/shukob/dekyx.git"]
dekyx-core = { path = "crates/dekyx-core" }

# Unpublished integration overlay; see zkfmi-crypto/docs/INTEGRATION_SOURCES.json.
[patch."https://github.com/shukob/deccp.git"]
deccp-core = { path = "../deccp/crates/deccp-core" }
