[workspace]
members = ["crates/dekyx-core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/shukob/zkfmi-crypto.git", rev = "713e842a7e298e6224297b03df9d6ade19148bb2" }
dekyx-core = { path = "crates/dekyx-core" }
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core", "serde"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
serde_json = "1.0.145"


[patch."https://github.com/shukob/dekyx.git"]
dekyx-core = { path = "crates/dekyx-core" }
